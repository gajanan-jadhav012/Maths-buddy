<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Buddy Day 2 Fixed</title>
<style>
  body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .card{background:#1e293b;padding:25px;border-radius:20px;width:90%;max-width:380px;text-align:center}
  h1{color:#38bdf8}
  .stats{display:flex;justify-content:space-around;margin:15px 0;background:#0f172a;padding:10px;border-radius:10px;font-weight:bold}
  .question{font-size:36px;margin:25px 0;font-weight:bold;background:#0f172a;padding:15px;border-radius:12px}
  input{width:80%;padding:14px;border-radius:10px;border:none;font-size:22px;text-align:center}
  button{width:85%;padding:14px;margin-top:12px;border-radius:10px;border:none;background:#38bdf8;font-size:18px;font-weight:bold}
  .msg{margin-top:15px;font-size:18px;min-height:25px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h1>🎮 MATH BUDDY DAY 2</h1>
  <div class="stats">
    <div>Score: <span id="score">0</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>
  <div class="question" id="q">Click Start</div>
  <input type="number" id="ans" placeholder="Type answer">
  <button onclick="check()">Submit Answer</button>
  <button onclick="start()" style="background:#334155;color:white">New Question</button>
  <div class="msg" id="msg"></div>
</div>

<script>
let score=0, level=1, a,b,correct,op;

function start(){
  let max = 10 * level;
  a = Math.floor(Math.random()*max)+1;
  b = Math.floor(Math.random()*10)+1;
  
  let ops = ['+','-','*'];
  if(level==1) op='+';
  else if(level<=3) op = ops[Math.floor(Math.random()*2)];
  else op = ops[Math.floor(Math.random()*3)];

  if(op=='-' && a<b){ let t=a; a=b; b=t; }

  if(op=='+') correct=a+b;
  if(op=='-') correct=a-b;
  if(op=='*') correct=a*b;

  document.getElementById('q').innerText = a + ' ' + op + ' ' + b + ' = ?';
  document.getElementById('ans').value='';
  document.getElementById('msg').innerText='';
  document.getElementById('ans').focus();
}

function check(){
  let user = document.getElementById('ans').value;
  if(user===''){ 
    document.getElementById('msg').innerText='Type an answer first!';
    return;
  }
  
  if(parseInt(user)===correct){
    score+=10;
    document.getElementById('msg').innerText='✅ Correct! +10 XP';
    document.getElementById('msg').style.color='#4ade80';
    if(score%30===0){ level++; document.getElementById('msg').innerText='🔥 LEVEL UP! Level '+level; }
    document.getElementById('score').innerText=score;
    document.getElementById('level').innerText=level;
    setTimeout(start, 800);
  } else {
    document.getElementById('msg').innerText='❌ Wrong! Answer is '+correct;
    document.getElementById('msg').style.color='#f87171';
  }
}

// auto start first question
start();
</script>
</body>
</html>
